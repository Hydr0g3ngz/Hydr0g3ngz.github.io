<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Choose a project · Will Studio</title>
  <link rel="stylesheet" href="/launchpad.css">
</head>
<body>
  <header class="launchpad-topbar">
    <a class="launchpad-brand" href="/" aria-label="Will Studio project chooser"><span class="launchpad-mark" aria-hidden="true">W</span><span>Will <i>Studio</i></span><span class="launchpad-local">LOCAL</span></a>
    <span class="launchpad-topnote">Your files. Your workspace.</span>
  </header>
  <main class="launchpad" data-launchpad aria-label="Choose a local website project">
    <p class="launchpad-loading" role="status">Opening your local workspace…</p>
    <noscript><p>Enable JavaScript to check and open a trusted local project. No project has been started.</p></noscript>
  </main>
  <script type="module" src="/launchpad.js"></script>
</body>
</html>
